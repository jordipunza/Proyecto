<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Talleres Casti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/breakpoint.css">
    <link rel="stylesheet" href="css/paneladmin.css">
</head>

<body class="bg-light">
<header class="simple-header">
        <div class="header-content">
            <a href="index.html">
                <i class="bi bi-arrow-left flex-arrow"></i>
            </a>
        </div>
    </header>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Gestión de Inventario</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalObjeto"
            onclick="prepararNuevo()">
            Nuevo Objeto
        </button>
    </div>

    <h3 class="mb-3"><i class="bi bi-calendar-check me-2"></i>Alquileres</h3>
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Imagen</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaAlquileres">
                    </tbody>
            </table>
        </div>
    </div>

    <h3 class="mb-3"><i class="bi bi-cart3 me-2"></i>Compras</h3>
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Imagen</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaVentas">
                    </tbody>
            </table>
        </div>
    </div>
</div>

    <div class="modal fade" id="modalObjeto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Añadir Nuevo Objeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formObjeto">
                        <input type="hidden" id="objeto_id" name="id">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tipo</label>
                                <select name="tipo" class="form-select" required>
                                    <option value="compra">Compra</option>
                                    <option value="alquiler">Alquiler</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Cantidad</label>
                                <input type="number" name="cantidad" class="form-control" value="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" name="precio" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Calificación (1-5)</label>
                                <input type="number" name="calificacion" class="form-control" value="5" min="1" max="5"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Estado (solo para alquileres)</label>
                                <select name="estado" class="form-select">
                                    <option value="">Ninguno</option>
                                    <option value="disponible">Disponible</option>
                                    <option value="mantenimiento">Mantenimiento</option>
                                    <option value="ocupado">Ocupado</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Descuento (%)</label>
                                <input type="number" name="descuento" class="form-control" value="0">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Imagen</label>
                                <input type="file" id="inputImagen" name="imagen" class="form-control" accept="image/*">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Detalles</label>
                                <textarea name="detalles" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-success">Guardar Objeto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>





    <div class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Gestión de Citas</h1>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID Cita</th>
                            <th>ID Cliente</th>
                            <th>Nombre Cliente</th>
                            <th>Tipo Consulta</th>
                            <th>Matrícula</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaCitas"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalVerCita" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalles de la Cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="detalleCitaContenido"></div>
                    <input type="hidden" id="cita_id_finalizar">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" id="btnFinalizarCita" class="btn btn-success" onclick="finalizarCita()">Marcar
                        como Finalizada</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
